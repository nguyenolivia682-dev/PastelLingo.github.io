
<!DOCTYPE html>

  <!-- Phông chữ Google Fonts tiếng Việt + Hàn + Trung -->

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans KR', 'Noto Sans SC', 'sans-serif'],
            display: ['Nunito', 'sans-serif'],
          },
          colors: {
            pastel: {
              bg: '#FFF8FA',
              card: '#FFFFFF',
              pink: '#FFE5EC',
              pinkDark: '#FF8FAB',
              pinkText: '#9D174D',
              mint: '#E2ECE9',
              mintDark: '#6EE7B7',
              mintText: '#065F46',
              blue: '#E0F2FE',
              blueDark: '#7DD3FC',
              blueText: '#075985',
              purple: '#F3E8FF',
              purpleDark: '#D8B4FE',
              purpleText: '#5B21B6',
              yellow: '#FEF3C7',
              yellowDark: '#FCD34D',

              peach: '#FFEDD5',
              peachText: '#9A3412'

  </script>
  
  <style>
    /* Reset & Base Styles */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #FFF8FA;
      color: #334155;
      font-family: 'Inter', 'Noto Sans KR', 'Noto Sans SC', sans-serif;
      overflow-x: hidden;
    }
    
    /* Hiệu ứng lật thẻ 3D SRS */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    
    /* Thanh cuộn pastel dịu mắt */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #FFF8FA;
    }
    ::-webkit-scrollbar-thumb {
      background: #FBCFE8;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #F472B6;
    }
    
    /* Đổ bóng mềm mại pastel */
    .pastel-shadow {
      box-shadow: 0 10px 28px -6px rgba(244, 114, 182, 0.12), 0 4px 12px -2px rgba(148, 163, 184, 0.08);
    }
    .pastel-shadow-sm {
      box-shadow: 0 4px 14px -2px rgba(148, 163, 184, 0.1);
    }
    
    /* Hiệu ứng xuất hiện */
    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      70% { transform: scale(1.01); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.25s ease-out forwards;
    }
    
    @keyframes pulseRing {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
      70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(244, 63, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }
    .mic-recording {
      animation: pulseRing 1.5s infinite;
    }
  </style>
</head>

  <script>
    /*************************************************************************
     * 1. DỮ LIỆU BAN ĐẦU & TỰ ĐỘNG KHÔI PHỤC KHI LỖI LOCALSTORAGE
     *************************************************************************/
    const STORAGE_KEY = 'pastellingo_v3_data';
    const DAY_MS = 24 * 60 * 60 * 1000;

    function getTodayStr(offsetDays = 0) {
      try {
        const d = new Date(Date.now() - offsetDays * DAY_MS);
        return d.toISOString().split('T')[0];
      } catch (e) {
        return '2026-01-01';
      }
    }

    // Danh sách các loại từ (Part of Speech) chuẩn
    const POS_PRESETS = [
      { id: 'n.', label: 'Danh từ (n.)', color: 'bg-pink-100 text-pink-800 border-pink-200' },
      { id: 'v.', label: 'Động từ (v.)', color: 'bg-sky-100 text-sky-800 border-sky-200' },
      { id: 'adj.', label: 'Tính từ (adj.)', color: 'bg-amber-100 text-amber-800 border-amber-200' },
      { id: 'adv.', label: 'Trạng từ (adv.)', color: 'bg-purple-100 text-purple-800 border-purple-200' },
      { id: 'pron.', label: 'Đại từ (pron.)', color: 'bg-indigo-100 text-indigo-800 border-indigo-200' },
      { id: 'prep.', label: 'Giới từ (prep.)', color: 'bg-blue-100 text-blue-800 border-blue-200' },
      { id: 'conj.', label: 'Liên từ (conj.)', color: 'bg-teal-100 text-teal-800 border-teal-200' },
      { id: 'interj.', label: 'Thán từ (interj.)', color: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
      { id: 'phrase', label: 'Cụm từ / Thành ngữ', color: 'bg-rose-100 text-rose-800 border-rose-200' },
      { id: 'other', label: 'Khác', color: 'bg-slate-100 text-slate-700 border-slate-200' }
    ];

    // Tạo dữ liệu mẫu mặc định (CHỈ có Tiếng Hàn & Tiếng Trung)
    function createInitialData() {
      const now = Date.now();
      return {
        currentLangId: 'ko',
        languages: [
          { id: 'ko', name: 'Tiếng Hàn', flag: '🇰🇷', speechCode: 'ko-KR', color: 'purple' },
          { id: 'zh', name: 'Tiếng Trung', flag: '🇨🇳', speechCode: 'zh-CN', color: 'yellow' }
        ],
        folders: [
          { id: 'f_ko_1', langId: 'ko', name: 'Giao tiếp hàng ngày', icon: '💬', color: 'purple' },
          { id: 'f_ko_2', langId: 'ko', name: 'K-Drama & Cảm xúc', icon: '🌸', color: 'pink' },
          { id: 'f_zh_1', langId: 'zh', name: 'HSK 1 - Chào hỏi & Làm quen', icon: '🏮', color: 'yellow' }
        ],
        decks: [
          { id: 'd_ko_1', folderId: 'f_ko_1', langId: 'ko', name: 'Lời chào & Cảm ơn', description: 'Các câu xã giao cơ bản trong tiếng Hàn' },
          { id: 'd_ko_2', folderId: 'f_ko_2', langId: 'ko', name: 'Biểu cảm thông dụng', description: 'Từ vựng hay gặp trong phim Hàn' },
          { id: 'd_zh_1', folderId: 'f_zh_1', langId: 'zh', name: 'Chào hỏi HSK 1', description: 'Từ vựng tiếng Trung cơ bản kèm Pinyin' }
        ],
        cards: [
          // Tiếng Hàn
          { id: 'c_ko_1', deckId: 'd_ko_1', langId: 'ko', term: '안녕하세요', pos: 'interj.', phonetic: 'Annyeonghaseyo', meaning: 'Xin chào (lịch sự)', example: '안녕하세요! 만나서 반갑습니다.', audioUrl: '', interval: 0, ease: 2.5, reps: 0, nextReview: now - 1000 },
          { id: 'c_ko_2', deckId: 'd_ko_1', langId: 'ko', term: '감사합니다', pos: 'interj.', phonetic: 'Gamsahamnida', meaning: 'Cảm ơn rất nhiều', example: '도와주셔서 정말 감사합니다.', audioUrl: '', interval: 4, ease: 2.6, reps: 3, nextReview: now + 3 * DAY_MS },
          { id: 'c_ko_3', deckId: 'd_ko_1', langId: 'ko', term: '학교', pos: 'n.', phonetic: 'Hakgyo', meaning: 'Trường học', example: '저는 내일 학교에 갑니다.', audioUrl: '', interval: 0, ease: 2.5, reps: 0, nextReview: now - 1000 },
          { id: 'c_ko_4', deckId: 'd_ko_1', langId: 'ko', term: '공부하다', pos: 'v.', phonetic: 'Gongbuhada', meaning: 'Học tập', example: '도서관에서 한국어를 공부해요.', audioUrl: '', interval: 0, ease: 2.5, reps: 0, nextReview: now - 1000 },
          { id: 'c_ko_5', deckId: 'd_ko_2', langId: 'ko', term: '대박', pos: 'interj.', phonetic: 'Daebak', meaning: 'Tuyệt vời / Đỉnh quá', example: '우와, 이거 진짜 대박이다!', audioUrl: '', interval: 0, ease: 2.5, reps: 0, nextReview: now - 1000 },
          { id: 'c_ko_6', deckId: 'd_ko_2', langId: 'ko', term: '괜찮아요', pos: 'adj.', phonetic: 'Gwaenchanayo', meaning: 'Không sao đâu / Tôi ổn', example: '걱정하지 마세요, 괜찮아요.', audioUrl: '', interval: 0, ease: 2.5, reps: 0, nextReview: now - 1000 },

          // Tiếng Trung
          { id: 'c_zh_1', deckId: 'd_zh_1', langId: 'zh', term: '你好', pos: 'interj.', phonetic: 'Nǐ hǎo', meaning: 'Xin chào', example: '你好，很高兴认识你！', audioUrl: '', interval: 0, ease: 2.5, reps: 0, nextReview: now - 1000 },
          { id: 'c_zh_2', deckId: 'd_zh_1', langId: 'zh', term: '谢谢', pos: 'v.', phonetic: 'Xièxie', meaning: 'Cảm ơn', example: '非常谢谢你的帮助。', audioUrl: '', interval: 5, ease: 2.5, reps: 2, nextReview: now + 2 * DAY_MS },
          { id: 'c_zh_3', deckId: 'd_zh_1', langId: 'zh', term: '学习', pos: 'v.', phonetic: 'Xuéxí', meaning: 'Học tập', example: '我在认真学习汉语。', audioUrl: '', interval: 0, ease: 2.5, reps: 0, nextReview: now - 1000 },
          { id: 'c_zh_4', deckId: 'd_zh_1', langId: 'zh', term: '朋友', pos: 'n.', phonetic: 'Péngyou', meaning: 'Bạn bè', example: '他是我的好朋友。', audioUrl: '', interval: 0, ease: 2.5, reps: 0, nextReview: now - 1000 }
        ],
        stats: {
          streak: 1,
          lastStudyDate: getTodayStr(0),
          totalReviews: 12,
          correctAnswers: 10,
          dailyHistory: {
            [getTodayStr(6)]: 2,
            [getTodayStr(5)]: 4,
            [getTodayStr(4)]: 1,
            [getTodayStr(3)]: 3,
            [getTodayStr(2)]: 5,
            [getTodayStr(1)]: 2,
            [getTodayStr(0)]: 3
          }
        }
      };
    }

    // Làm sạch và kiểm tra dữ liệu an toàn 100%
    function sanitizeData(raw) {
      const fallback = createInitialData();
      if (!raw || typeof raw !== 'object') return fallback;

      const languages = Array.isArray(raw.languages) && raw.languages.length > 0
        ? raw.languages.filter(l => l && typeof l.id === 'string' && typeof l.name === 'string')
        : fallback.languages;

      const currentLangId = languages.some(l => l.id === raw.currentLangId)
        ? raw.currentLangId
        : languages[0].id;

      const folders = Array.isArray(raw.fold
